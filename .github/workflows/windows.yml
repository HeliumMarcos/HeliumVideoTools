name: Windows .NET installer
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v3.0.15)'
        default: 'v3.0.15'
        required: true
      publish:
        description: Publicar instalador em Releases
        type: boolean
        default: false
      prerelease:
        description: Marcar como prévia
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Preparar ferramentas verificadas
        shell: pwsh
        run: ./scripts/Prepare-MediaTools.ps1
      - name: Compilar e testar processamento
        shell: pwsh
        run: |
          dotnet run --project tests/HeliumVideoTools.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Testes falharam' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --verify-close work/close-validation
          if ($LASTEXITCODE -ne 0) { throw 'Teste de fechamento WPF falhou' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --verify-themes work/theme-validation
          if ($LASTEXITCODE -ne 0) { throw 'Teste de temas WPF falhou' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --verify-operation-editor
          if ($LASTEXITCODE -ne 0) { throw 'Teste de configuração/resultados WPF falhou' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --verify-compact-workspace work/compact-workspace-validation
          if ($LASTEXITCODE -ne 0) { throw 'Teste do layout compacto/drop global/reset falhou' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --audit-responsive work/responsive-validation
          if ($LASTEXITCODE -ne 0) { throw 'Teste de layout adaptável/DPI falhou' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --verify-keyboard
          if ($LASTEXITCODE -ne 0) { throw 'Teste de teclado falhou' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --verify-accessible-events work/accessibility-events
          if ($LASTEXITCODE -ne 0) { throw 'Teste UIA entre processos falhou' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --verify-displays work/accessibility-displays
          if ($LASTEXITCODE -ne 0) { throw 'Teste de monitores disponíveis falhou' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --verify-recovered-summary work/recovered-summary
          if ($LASTEXITCODE -ne 0) { throw 'Teste de resumo recuperado/escalas falhou' }
          $fixture = (Get-ChildItem -Path 'work/smoke-*/audiência teste.mp4' | Select-Object -Last 1).FullName
          if (-not $fixture) { throw 'Amostra sintética de estimativa ausente' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --render work/estimate-standard.png Compress 1280 900 estimate $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Estimativa WPF padrão falhou' }
          dotnet run --project tests/HeliumVideoTools.Tests -c Release -- --render work/estimate-minimum.png Compress 980 700 estimate $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Estimativa WPF mínima falhou' }
      - name: Preparar NSIS
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          for ($attempt = 1; $attempt -le 3 -and -not (Test-Path -LiteralPath $nsis); $attempt++) {
            choco install nsis -y --no-progress
            if (-not (Test-Path -LiteralPath $nsis)) {
              Write-Output "NSIS ainda indisponível após tentativa $attempt; repetindo preparação."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not (Test-Path -LiteralPath $nsis)) { throw 'NSIS não foi instalado após três tentativas' }
      - name: Compilar instalador self-contained
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1 -Installer
      - name: Testar instalação e reinstalação
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $setup = (Get-ChildItem artifacts/release/*-Setup.exe | Select-Object -First 1).FullName
          ./scripts/Test-InstalledPackage.ps1 -Installer $setup
      - name: Testar interrupção do instalador em raízes isoladas
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/Test-InterruptedInstaller.ps1 -Nsis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          name: HeliumVideoTools-Windows-Installer
          path: artifacts/release/*
          if-no-files-found: error
      - name: Publicar em Releases
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -notmatch ('^v' + [regex]::Escape($version) + '(-preview\.[0-9]+)?$')) { throw 'Tag não corresponde à versão do produto' }
          $options = @('--verify-tag')
          if ($env:GITHUB_REF -notlike 'refs/tags/*') { $options = @('--target', $env:GITHUB_SHA) }
          if ($env:PRERELEASE -eq 'true' -or $env:RELEASE_TAG -like '*-preview.*') { $options += '--prerelease' }
          gh release create $env:RELEASE_TAG artifacts/release/* --title "Helium Vídeo Tools $env:RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md @options
          if ($LASTEXITCODE -ne 0) { throw 'Publicação da release falhou' }
